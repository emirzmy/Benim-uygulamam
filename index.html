<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Benim Uygulamam</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #111827;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
    }
    .kutu {
      text-align: center;
      background: #1f2937;
      padding: 30px;
      border-radius: 20px;
      box-shadow: 0 0 20px rgba(0,0,0,0.3);
    }
    button {
      margin-top: 20px;
      padding: 12px 20px;
      border: none;
      border-radius: 10px;
      background: #2563eb;
      color: white;
      font-size: 16px;
    }
  </style>
</head>
<body>
  <div class="kutu">
    <h1>Merhaba Emir</h1>
    <p>İlk uygulaman başarıyla çalışıyor.</p>
    <button onclick="mesajGoster()">Tıkla</button>
  </div>

  <script>
    function mesajGoster() {
      alert("Buton çalıştı!");
    }
  </script>
</body>
</html>
